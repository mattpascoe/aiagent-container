# Set up common environment variables to be used by all
x-common-env: &common-env
  EDITOR: vi
  SHELLOPTS: vi
  HOME: /home/node
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}
  REAL_USER: ${REAL_USER:-Unknown}
  PARANOID_MODE: ${PARANOID_MODE:-true}
  GIT_AUTHOR_NAME: ${GIT_NAME:-$REAL_USER}
  GIT_COMMITTER_NAME: ${GIT_NAME:-$REAL_USER}
  TZ: America/Denver

x-common-service: &common-service
  tty: true
  stdin_open: true
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  restart: "no"
  pids_limit: 150
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - ai_network

services:
  claude:
    <<: *common-service
    build:
      context: .
      dockerfile: claude/Dockerfile
    image: local/${REAL_USER:-Unknown}-claude
    environment:
      <<: *common-env
      DEVCONTAINER: true
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # agentharness-comms: container-scoped agent identity, optional overrides
      AGENTHARNESS_CNAME: ${CLAUDE_CNAME:-}
      AGENTHARNESS_PURPOSE: ${CLAUDE_PURPOSE:-}
      AGENTHARNESS_COLOR: ${CLAUDE_COLOR:-}
      # Coms project namespace. Defaults to basename of WORKDIR (set by the
      # Makefile); claude-role also passes this explicitly via -e.
      AGENTHARNESS_PROJECT: ${PROJECT:-}
    volumes:
      - ${WORKDIR}:/workspace
      - ~/.claude:/home/node/.claude
      - ~/.agentharness-comms:/home/node/.agentharness-comms
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=755,noexec,nodev,nosuid

  hermes:
    <<: *common-service
    # for now just run as root. too much baggage to try and fix
    user: "root:root"
    build:
      context: .
      dockerfile: hermes/Dockerfile
    image: local/${REAL_USER:-Unknown}-hermes
    read_only: false # Hermes needs to be writable for lazy loading python modules or it logs a ton of errors trying.
    environment:
      <<: *common-env
      HOME: /root
      HERMES_DASHBOARD: 1
      START_DASHBOARD: 1 # Start Hermes dashboard in background along side TUI. Used by entrypoint.sh
    ports:
      - "127.0.0.1:9119:9119" # Hermes dashboard on for docker host only as bound to 127.0.0.1
    volumes:
      - ${WORKDIR}:/workspace
      - ~/.hermes:/root/.hermes
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777

  opencode:
    <<: *common-service
    build:
      context: .
      dockerfile: opencode/Dockerfile
    image: local/${REAL_USER:-Unknown}-${SVC}
    environment:
      <<: *common-env
    volumes:
      - ${WORKDIR}:/workspace
      # Have to map all the XDG directories for opencode
      - ~/.config/opencode:/home/node/.config/opencode
      - ~/.local/share/opencode:/home/node/.local/share/opencode
      - ~/.local/state/opencode:/home/node/.local/state/opencode
      - ~/.cache/opencode:/home/node/.cache/opencode
    tmpfs:
      - /tmp:exec,nodev,nosuid,mode=1777 # Note, had to make this exec so that opencode could run in the container

  pi:
    <<: *common-service
    build:
      context: .
      dockerfile: pi/Dockerfile
    image: local/${REAL_USER:-Unknown}-pi
    environment:
      <<: *common-env
      PI_CODING_AGENT_DIR: ~/.pi/agent
      # agentharness-comms: container-scoped agent identity, optional overrides
      AGENTHARNESS_CNAME: ${PI_CNAME:-}
      AGENTHARNESS_PURPOSE: ${PI_PURPOSE:-}
      AGENTHARNESS_COLOR: ${PI_COLOR:-}
    volumes:
      - ${WORKDIR}:/workspace
      - ~/.pi:/home/node/.pi
      - ~/.agentharness-comms:/home/node/.agentharness-comms
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

