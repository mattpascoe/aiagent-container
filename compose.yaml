# Set up common environment variables to be used by all
x-common-env: &common-env
  EDITOR: vi
  SHELLOPTS: vi
  HOME: /home/node
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}
  REAL_USER: ${REAL_USER:-Unknown}
  PARANOID_MODE: ${PARANOID_MODE:-true}
  GIT_AUTHOR_NAME: ${GIT_NAME:-$REAL_USER}
  GIT_COMMITTER_NAME: ${GIT_NAME:-$REAL_USER}
  TZ: America/Denver

x-common-service: &common-service
  tty: true
  stdin_open: true
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  restart: "no"
  pids_limit: 150
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - ai_network

services:
  claude:
    <<: *common-service
    build:
      context: .
      dockerfile: claude/Dockerfile
      args:
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
        - REAL_USER=${REAL_USER:-node}
    image: local/${REAL_USER:-Unknown}-claude
    environment:
      <<: *common-env
      DEVCONTAINER: true
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - workspace:/workspace
      - home_claude:/home/node/.claude
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=755,noexec,nodev,nosuid

  hermes:
    <<: *common-service
    user: "root:root"
    build:
      context: .
      dockerfile: hermes/Dockerfile
      args:
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
        - REAL_USER=${REAL_USER:-hermes}
    image: local/${REAL_USER:-Unknown}-hermes
    read_only: false # Hermes needs to be writable for lazy loading python modules or it logs a ton of errors trying.
    environment:
      <<: *common-env
      HOME: /root
      HERMES_DASHBOARD: 1
      START_DASHBOARD: 1 # Start Hermes dashboard in background along side TUI. Used by entrypoint.sh
    ports:
      - "127.0.0.1:9119:9119" # Hermes dashboard on for docker host only as bound to 127.0.0.1
    volumes:
      - workspace:/workspace
      - home_hermes:/root/.hermes
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777

  pi:
    <<: *common-service
    build:
      context: .
      dockerfile: pi/Dockerfile
      args:
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
        - REAL_USER=${REAL_USER:-node}
    image: local/${REAL_USER:-Unknown}-pi
    environment:
      <<: *common-env
      PI_CODING_AGENT_DIR: ~/.pi/agent
    volumes:
      - workspace:/workspace
      - home_pi:/home/node/.pi
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

volumes:
  home_claude:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/.claude

  home_hermes:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/.hermes

  home_pi:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/.pi

  workspace:
    name: ${REAL_USER}_workspace_${SVC}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WORKDIR}

networks:
  ai_network:
    driver: bridge
